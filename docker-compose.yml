services:
  mysql:
    image: mysql:8
    container_name: recipehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recipehub
      MYSQL_USER: recipehub
      MYSQL_PASSWORD: recipehub
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
