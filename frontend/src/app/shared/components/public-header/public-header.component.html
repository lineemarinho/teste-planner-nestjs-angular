<header class="public-header">
  <div class="inner">
    <a routerLink="/recipes" class="brand">
      <span class="brand-mark">🍳</span>
      <span class="brand-name">RecipeHub</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/recipes" routerLinkActive="active">Receitas</a>
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
    </nav>

    <a *ngIf="!isAuthenticated" routerLink="/login" class="enter-button">
      Entrar
    </a>
    <button
      *ngIf="isAuthenticated"
      type="button"
      class="enter-button"
      (click)="logout()"
    >
      Sair
    </button>
  </div>
</header>
