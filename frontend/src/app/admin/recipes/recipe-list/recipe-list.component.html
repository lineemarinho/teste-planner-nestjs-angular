<div class="recipe-list-page">
  <header class="page-header">
    <h1>Receitas</h1>
    <button mat-flat-button color="primary" (click)="onNew()">
      Nova Receita
    </button>
  </header>

  <table mat-table [dataSource]="recipes" class="mat-elevation-z1">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let recipe">{{ recipe.title }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Categoria</th>
      <td mat-cell *matCellDef="let recipe">{{ recipe.category?.name }}</td>
    </ng-container>

    <ng-container matColumnDef="difficulty">
      <th mat-header-cell *matHeaderCellDef>Dificuldade</th>
      <td mat-cell *matCellDef="let recipe">
        <app-difficulty-badge
          [difficulty]="recipe.difficulty"
        ></app-difficulty-badge>
      </td>
    </ng-container>

    <ng-container matColumnDef="preparationTime">
      <th mat-header-cell *matHeaderCellDef>Tempo (min)</th>
      <td mat-cell *matCellDef="let recipe">{{ recipe.preparationTime }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let recipe" class="actions-cell">
        <button mat-icon-button (click)="onEdit(recipe)" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          (click)="onDelete(recipe)"
          aria-label="Excluir"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <p *ngIf="recipes.length === 0" class="empty-state">
    Nenhuma receita cadastrada.
  </p>
</div>
