<div class="category-list-page">
  <header class="page-header">
    <h1>Categorias</h1>
    <button mat-flat-button color="primary" (click)="onNew()">Nova Categoria</button>
  </header>

  <div class="table-card">
    <table mat-table [dataSource]="categories">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let category">{{ category.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let category">{{ category.description }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let category" class="actions-cell">
          <button mat-icon-button (click)="onEdit(category)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(category)" aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    @if (categories.length === 0) {
      <p class="empty-state">Nenhuma categoria cadastrada.</p>
    }
  </div>
</div>
